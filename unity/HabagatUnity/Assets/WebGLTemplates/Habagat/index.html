<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover so the canvas reaches under a notch rather than
         letterboxing itself away from it. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Inline rather than a .ico file, for the same reason the tool icons and the
         rounded corners are drawn in code: no binary UI assets. Without any link at
         all the browser still requests /favicon.ico and logs a 404, which is exactly
         the sort of harmless noise that wastes somebody's afternoon later. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cfe3e8'/%3E%3Cpath d='M2 20q5-5 10 0t10 0 8-3v13H2z' fill='%232f7f8c'/%3E%3Cpath d='M6 15l10-8 10 8-4 0 0 6H10v-6z' fill='%23d9442b'/%3E%3C/svg%3E">
    <style>
      /* The stock Unity template sizes the canvas from a user-agent test and
         falls back to a hardcoded 960x600. Anything it does not recognise —
         headless Chromium, an iPad (which reports as a Mac), a phone in
         "desktop site" mode — gets the fixed size, overflows the viewport and
         pushes the entire tool bar off screen. Sizing from the element instead
         needs no guess about what is running it. */
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #cfe3e8; }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Load-bearing on a phone. Without it the browser claims a two-finger
           drag for page zoom and a one-finger drag for scroll — which are
           exactly the camera's pinch and orbit gestures, so the controls read
           as broken while the game never sees the touches at all. */
        touch-action: none;
        /* A long press over a canvas otherwise raises the text-selection
           callout in the middle of a brush stroke. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }

      #loading {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #22303a;
        text-align: center;
      }
      #bar { width: 220px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.65); overflow: hidden; }
      #fill { width: 0; height: 100%; background: #d9442b; transition: width 0.15s linear; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>
        <div style="margin-bottom: 12px">Loading {{{ PRODUCT_NAME }}}…</div>
        <div id="bar"><div id="fill"></div></div>
      </div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      // Feature detection rather than a user-agent test, for the same reason the
      // sizing is. A coarse pointer means a finger.
      //
      // Capping the pixel ratio is a real decision: this scene runs 1500 instanced
      // props and full post-processing, and a modern phone reports devicePixelRatio
      // 3, so an 844x390 layout would ask for a 2532x1170 render target. That is
      // more pixels than the desktop build draws. 2 is a starting point, not a
      // measured optimum — nobody has run this on a phone yet.
      if (window.matchMedia("(pointer: coarse)").matches) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#loading").textContent = message;
      });
    </script>
  </body>
</html>
